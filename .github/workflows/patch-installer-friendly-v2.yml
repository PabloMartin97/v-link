name: Apply Lite installer UX patch

on:
  push:
    branches:
      - installer-user-friendly

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: installer-user-friendly
          fetch-depth: 0
      - name: Patch and validate installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/patch_installer_ux.py
          bash -n Install-Lite.sh
          bash Install-Lite.sh --help >/tmp/install-lite-help.txt
          grep -q -- '--hardware' /tmp/install-lite-help.txt
          grep -q 'Available GitHub branches' Install-Lite.sh
          grep -q 'DEVELOPMENT WARNING' Install-Lite.sh
          grep -q 'Continue with this installation plan' Install-Lite.sh
          git rm .github/workflows/patch-installer-friendly.yml
          git rm .github/workflows/patch-installer-friendly-v2.yml
          git rm tools/patch_installer_ux.py
          git add Install-Lite.sh
          git commit -m "Make Lite installer interactive and user friendly"
          git push origin HEAD:installer-user-friendly
