name: Patch first-boot installer mode

on:
  push:
    branches:
      - little-os-test

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: little-os-test
          fetch-depth: 0
      - name: Patch and validate first-boot installer
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/patch_firstboot.py
          bash -n Install-Lite.sh
          bash Install-Lite.sh --help >/tmp/help.txt
          grep -q -- '--first-boot' /tmp/help.txt
          grep -q 'INTERNET CONNECTION REQUIRED' Install-Lite.sh
          grep -q 'cleanup_first_boot_stage' Install-Lite.sh
          bash -n V-Link-FirstBoot.sh
          bash -n Prepare-V-Link-SD.command
          git rm .github/workflows/patch-firstboot-installer.yml .github/patch_firstboot.py
          git add Install-Lite.sh V-Link-FirstBoot.sh Prepare-V-Link-SD.command
          git commit -m "Add automatic first-boot Lite installation flow"
          git push origin HEAD:little-os-test
